<meta charset="utf-8">
<title>UMA for Agents — may your agent touch my stuff?</title>
<meta name="description" content="Alice sets her terms once. Bob's agent negotiates against them while she's asleep. An animated explanation of UMA for Agents.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="UMA for Agents">
<meta property="og:description" content="Alice sets her terms once. Other people's agents negotiate against them — while she's offline.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">

<main>
  <!-- The stage. One cast, moved around; the scenes are camera directions,
       not separate drawings. Hand-authored in the same visual language as the
       diagrams in docs/.

       Everything is written out rather than defined once in <defs> and
       cloned with <use>: a <use> puts its content in a shadow tree, where
       neither querySelector nor CSS can reach it, so `#agent .eye` would
       match nothing and the animations that address a part of an actor would
       silently do nothing at all. Each actor appears exactly once here, so
       the clone bought nothing and cost that. -->
  <div id="stage-wrap">
    <!-- The band the action happens in. The cast stands on y=560 and the
         tallest thing on stage is the vault at y=350, so everything above
         that was empty sky. -->
    <svg id="stage" viewBox="0 175 1200 465" role="img"
         aria-labelledby="stage-title stage-desc">
      <title id="stage-title">How UMA for Agents works</title>
      <desc id="stage-desc">Alice sets her access terms and goes offline. Bob's
        AI agent is refused by her vault and given a ticket, takes the ticket to
        Alice's authorization server, is handed her terms, signs them, and is
        granted scoped access. For a trade, her phone buzzes and she approves one
        single-use key.</desc>

      <defs>
        <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b8cff"/>
          <stop offset="1" stop-color="#8f6bff"/>
        </linearGradient>
        <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#5b8cff" stop-opacity="0.10"/>
          <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#8f6bff" stop-opacity="0.08"/>
          <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
        </radialGradient>

        <!-- Actors wait offstage at x=-140, which is outside the viewBox but
             not outside the element: when the element is wider than the
             viewBox's aspect ratio the drawing is letterboxed, and anything
             beyond the viewBox renders happily into the side bands. So the
             wings have to be drawn shut explicitly. -->
        <clipPath id="stage-clip">
          <rect x="0" y="175" width="1200" height="465"/>
        </clipPath>
      </defs>

      <g clip-path="url(#stage-clip)">
      <rect x="0" y="175" width="1200" height="465" fill="url(#glow1)"/>
      <rect x="200" y="220" width="1000" height="420" fill="url(#glow2)"/>
      <path d="M40 560 H1160" class="ground"/>

      <!-- ===================== PLACES (they don't move) ==================== -->

      <g id="place-home" transform="translate(150 560)">
        <rect x="-92" y="-60" width="184" height="16" rx="5" class="desk"/>
        <rect x="-46" y="-72" width="92" height="12" rx="3" class="panel-2"/>
        <!-- The lid's hinge is the static translate; the rotation goes on the
             inner group, because the timeline overwrites whatever transform
             it animates. -->
        <g transform="translate(-46 -72)">
          <g id="laptop-lid">
            <rect id="laptop-screen" x="0" y="-58" width="92" height="58" rx="4" class="screen"/>
          </g>
        </g>
        <text x="0" y="42" class="place-label">ALICE</text>
        <text x="0" y="60" class="place-sublabel">an owner, not an operator</text>
      </g>

      <g id="place-nightstand" transform="translate(300 560)" opacity="0">
        <rect x="-34" y="-46" width="68" height="46" rx="6" class="desk"/>
        <rect x="-26" y="-98" width="52" height="94" rx="9" class="phone-body"/>
        <rect id="phone-screen" x="-20" y="-91" width="40" height="76" rx="4" class="phone-screen"/>
        <g id="buzz" opacity="0">
          <path d="M-42 -122 q-10 -10 0 -20 M42 -122 q10 -10 0 -20" class="buzz-line"/>
          <path d="M-56 -112 q-16 -16 0 -34 M56 -112 q16 -16 0 -34" class="buzz-line"/>
        </g>
      </g>

      <!-- Where her policy lives, and answers, while she is asleep. -->
      <g id="place-as" transform="translate(700 560)">
        <rect x="-80" y="-150" width="160" height="150" rx="12" class="panel"/>
        <path d="M-80 -150 L0 -196 L80 -150 Z" class="roof"/>
        <path id="as-shield" d="M0 -128 l30 12 v22 q0 26 -30 38 q-30 -12 -30 -38 v-22 z" class="shield"/>
        <path d="M-12 -96 l9 10 l17 -19" class="tick"/>
        <text x="0" y="42" class="place-label">HER AUTHORIZATION SERVER</text>
        <text x="0" y="60" class="place-sublabel">her policy, her side</text>
      </g>

      <!-- The resource server. Not "Alice's vault": it is her brokerage's,
           and it holds many clients' holdings in one place — which is why the
           authority over hers cannot live here. Every row is someone's; only
           the lit one is Alice's, and only that row is what her authorization
           server has anything to say about. The others belong to owners who
           have their own policy, somewhere else. -->
      <g id="place-vault" transform="translate(1040 560)">
        <rect x="-92" y="-228" width="184" height="228" rx="12" class="panel"/>

        <g class="tenant-row">
          <rect x="-76" y="-212" width="152" height="42" rx="6" class="panel-2"/>
          <circle cx="-56" cy="-191" r="7" class="tenant-dot"/>
          <path d="M-38 -197 H50 M-38 -185 H24" class="tenant-line"/>
        </g>

        <!-- Alice's. -->
        <g id="alice-row">
          <rect x="-76" y="-162" width="152" height="42" rx="6" class="own-row"/>
          <circle cx="-56" cy="-141" r="7" class="own-dot"/>
          <path d="M-38 -147 H50 M-38 -135 H30" class="own-line"/>
          <text x="-76" y="-168" class="own-label">ALICE'S HOLDINGS</text>
        </g>

        <g class="tenant-row">
          <rect x="-76" y="-112" width="152" height="42" rx="6" class="panel-2"/>
          <circle cx="-56" cy="-91" r="7" class="tenant-dot"/>
          <path d="M-38 -97 H50 M-38 -85 H38" class="tenant-line"/>
        </g>
        <g class="tenant-row">
          <rect x="-76" y="-62" width="152" height="42" rx="6" class="panel-2"/>
          <circle cx="-56" cy="-41" r="7" class="tenant-dot"/>
          <path d="M-38 -47 H50 M-38 -35 H18" class="tenant-line"/>
        </g>

        <!-- The lock sits on Alice's row, because that is the only row this
             story is about. -->
        <g transform="translate(56 -141)">
          <circle cx="0" cy="0" r="15" class="vault-dial"/>
          <path id="vault-spokes" d="M0 -15 V15 M-15 0 H15 M-10.6 -10.6 L10.6 10.6 M10.6 -10.6 L-10.6 10.6"
                class="vault-spokes"/>
          <circle cx="0" cy="0" r="4" class="vault-hub"/>
        </g>

        <text x="0" y="42" class="place-label">MERIDIAN WEALTH · RESOURCE SERVER</text>
        <text x="0" y="60" class="place-sublabel">many owners, one server</text>

        <g id="vault-no" opacity="0">
          <circle cx="0" cy="-141" r="40" class="ring-no"/>
          <path d="M-16 -157 L16 -125 M16 -157 L-16 -125" class="cross-no"/>
        </g>
        <g id="vault-yes" opacity="0">
          <circle cx="0" cy="-141" r="40" class="ring-yes"/>
          <path d="M-18 -141 l13 14 l24 -27" class="check-yes"/>
        </g>
      </g>

      <!-- ===================== ACTORS (they move) ========================== -->
      <!-- No `transform` attribute on any of these. The timeline composes
           their transform from x/y, and an attribute here would be replaced
           the first time one of them moved — putting the actor at the origin
           instead of on the ground. Their starting marks are in u4a.js, with
           the rest of the blocking. -->

      <g id="alice">
        <circle cx="0" cy="-86" r="14" class="fig head"/>
        <path d="M-15 -90a15 15 0 0 1 30 0q-9 -7 -15 -4q-6 -3 -15 4z" class="hair"/>
        <path d="M0 -72 V-32" class="fig"/>
        <path id="alice-arm-l" d="M0 -63 L-21 -46" class="fig arm-l"/>
        <path id="alice-arm-r" d="M0 -63 L21 -46" class="fig arm-r"/>
        <path d="M0 -32 L-15 0" class="fig"/>
        <path d="M0 -32 L15 0" class="fig"/>
      </g>

      <g id="bob">
        <circle cx="0" cy="-86" r="14" class="fig head"/>
        <path d="M-14 -93q14 -9 28 0" class="hair"/>
        <path d="M0 -72 V-32" class="fig"/>
        <path d="M0 -70 l-5 5 l5 17 l5 -17 z" class="tie"/>
        <path d="M0 -63 L-21 -46" class="fig"/>
        <path d="M0 -63 L21 -46" class="fig"/>
        <path d="M0 -32 L-15 0" class="fig"/>
        <path d="M0 -32 L15 0" class="fig"/>
      </g>

      <!-- Bob's agent. Deliberately a small, polite machine: the point of the
           whole protocol is that it is not the villain — it is simply not
           Alice, and that is enough to need a negotiation. -->
      <g id="agent">
        <path d="M0 -99 V-90" class="fig"/>
        <circle cx="0" cy="-102" r="4" class="bot-dot"/>
        <rect x="-20" y="-90" width="40" height="31" rx="10" class="bot-head"/>
        <circle class="eye" cx="-7.5" cy="-74" r="3.6"/>
        <circle class="eye" cx="7.5" cy="-74" r="3.6"/>
        <rect x="-15" y="-55" width="30" height="31" rx="9" class="bot-body"/>
        <path d="M-15 -45 L-28 -35" class="fig"/>
        <path d="M15 -45 L28 -35" class="fig"/>
        <path d="M-7 -24 V0" class="fig"/>
        <path d="M7 -24 V0" class="fig"/>
      </g>

      <!-- The setup's question: someone is going to ask for her holdings, and
           the server holding them is not the party who can answer. -->
      <g id="question" opacity="0">
        <circle cx="0" cy="0" r="30" class="q-ring"/>
        <text x="0" y="12" class="q-mark">?</text>
      </g>

      <!-- The permission ticket: the handle the whole negotiation hangs on. -->
      <g id="ticket" opacity="0">
        <path d="M-40 -22 h80 v13 a9 9 0 0 0 0 18 v13 h-80 v-13 a9 9 0 0 0 0 -18 z"
              class="ticket"/>
        <path d="M-22 -4 H22 M-22 8 H10" class="ticket-line"/>
      </g>

      <!-- The terms she proffers. -->
      <g id="scroll" opacity="0">
        <rect x="-62" y="-44" width="124" height="88" rx="7" class="paper"/>
        <path d="M-44 -22 H44 M-44 -6 H44 M-44 10 H30 M-44 26 H16" class="paper-line"/>
      </g>

      <g id="signature" opacity="0">
        <path id="sign-line" d="M-40 34 q10 -20 20 0 t20 -2 t18 -6" class="sign-line"/>
      </g>

      <!-- The single-use grant. It is a key, and it is going to break. -->
      <g id="key" opacity="0">
        <circle cx="-20" cy="0" r="14" class="key-ring"/>
        <path d="M-6 0 H34 M24 0 V12 M34 0 V14" class="key-blade"/>
      </g>

      <g id="ledger" opacity="0">
        <rect x="-210" y="-92" width="420" height="184" rx="12" class="panel"/>
        <text x="-182" y="-56" class="ledger-head">THE LEDGER</text>
        <g class="ledger-row"><text x="-182" y="-16">promised</text><text x="50" y="-16" class="ledger-v">terms, signed</text></g>
        <g class="ledger-row"><text x="-182" y="20">touched</text><text x="50" y="20" class="ledger-v">what it read</text></g>
        <g class="ledger-row"><text x="-182" y="56">approved</text><text x="50" y="56" class="ledger-v">the one trade</text></g>
      </g>

      <g id="titlecard" opacity="0">
        <rect x="0" y="175" width="1200" height="465" class="curtain"/>
        <g transform="translate(600 380)">
          <rect x="-25" y="-104" width="50" height="50" rx="13" fill="url(#mark)"/>
          <text x="0" y="-68" class="mark-glyph">U</text>
          <text x="0" y="6" class="title">UMA for Agents</text>
          <text x="0" y="54" class="subtitle">She isn’t online. Her policy is.</text>
        </g>
      </g>
      </g>
    </svg>
  </div>

  <p id="caption" aria-live="polite"></p>

  <div id="controls">
    <button id="toggle" type="button" aria-label="Pause">Pause</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1"
           aria-label="Scrub the animation">
    <button id="replay" type="button" aria-label="Replay from the start">Replay</button>
  </div>

  <!-- The story as text. Always in the DOM: it is the whole explanation for
       anyone who cannot or does not want to watch it move, and it is what a
       screen reader and a search engine get. -->
  <ol id="storyboard"></ol>

        0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04
        2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48

</main>
