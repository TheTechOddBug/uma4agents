# u4a.ai
#
# The site is a Gatsby project under site/, so Netlify builds from that
# directory and publishes what Gatsby emits. Everything it serves is
# same-origin: the animation library is a dependency rather than a CDN
# script, the QR code is a committed file, and no webfont is fetched.

[build]
  base = "site"
  command = "npm ci && npm run build"
  # Relative to `base`, not to the repo root — "site/public" here resolves to
  # site/site/public, which is nowhere.
  publish = "public"

[build.environment]
  NODE_VERSION = "20.15.0"

# The site answers MCP at /mcp, so an agent can read the posts without
# scraping the pages. The function serves a generated index rather than the
# Markdown tree, which is not deployed beside it — `included_files` is what
# gets that index into the bundle, and its path is relative to `base`.
[functions]
  # nft traces the real module graph. esbuild would have to be told about the
  # SDK's dynamic imports, and the JSON is loaded through createRequire.
  node_bundler = "nft"
  included_files = ["netlify/functions/blog-data.json"]

[[plugins]]
  package = "@netlify/plugin-gatsby"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The Markdown twin of every post, published by gatsby-node's onPostBuild so
# that a language model can read the words without the page around them.
[[headers]]
  for = "/blog/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
