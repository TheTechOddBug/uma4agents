<svg viewBox="0 0 1200 830" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="mark2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cc2d4"/><stop offset="1" stop-color="#5e8fa3"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.8" cy="0" r="0.8">
      <stop offset="0" stop-color="#8cc2d4" stop-opacity="0.09"/><stop offset="1" stop-color="#8cc2d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.7">
      <stop offset="0" stop-color="#5e8fa3" stop-opacity="0.07"/><stop offset="1" stop-color="#5e8fa3" stop-opacity="0"/>
    </radialGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24262c"/>
    </marker>
  </defs>

  <rect width="1200" height="830" fill="#0a0b0d"/>
  <rect width="1200" height="830" fill="url(#g1)"/>
  <rect width="1200" height="830" fill="url(#g2)"/>

  <!-- header -->
  <!-- U4A monogram. Geometry: site/src/style/marks.js · colour: site/src/style/theme.js -->
  <g transform="translate(40 26) scale(0.53125)">
    <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="15" fill="#0a0b0d" stroke="#8cc2d4" stroke-width="2.8"/>
    <g fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 17 L11 33 A5.75 5.75 0 0 0 22.5 33 L22.5 17" stroke="#ffffff"/>
      <path d="M34.5 17 L26.25 31 L37.75 31 M34.5 17 L34.5 39" stroke="#bcdb2c"/>
      <path d="M41.5 39 L47.25 17 L53 39 M43.5 31.5 L51 31.5" stroke="#ffffff"/>
    </g>
    <path d="M20 46.5 L44 46.5" fill="none" stroke="#8cc2d4" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <text x="88" y="42" fill="#ffffff" font-size="17" font-weight="650">UMA for Agents — what changed</text>
  <text x="88" y="60" fill="#a9aeb6" font-size="12">Aligning to MCP 2026-07-28, and what building a second enforcement host taught us</text>
  <text x="1160" y="50" text-anchor="end" fill="#6c727a" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace">branch: mcp-alignment</text>

  <!-- column headers -->
  <text x="290" y="106" fill="#8a7f76" font-size="10.5" letter-spacing="2" font-weight="700">BEFORE</text>
  <text x="725" y="106" fill="#bcdb2c" font-size="10.5" letter-spacing="2" font-weight="700">AFTER</text>
  <line x1="40" y1="116" x2="1160" y2="116" stroke="#24262c"/>

  <!-- ROW 1 -->
  <text x="58" y="152" fill="#ffffff" font-size="11.5" font-weight="650">Which software enforces</text>
  <text x="58" y="167" fill="#6c727a" font-size="9.5">FedAuthz §1.4 divides parties,</text>
  <text x="58" y="179" fill="#6c727a" font-size="9.5">not processes</text>
  <rect x="290" y="128" width="415" height="66" rx="10" fill="#0e0f12" stroke="#2e2721"/>
  <text x="306" y="150" fill="#c9b8a8" font-size="11">A gateway, always, with plain MCP servers behind it.</text>
  <text x="306" y="166" fill="#8a7f76" font-size="10.5">Our docs described that as where the burden belongs.</text>
  <text x="306" y="181" fill="#8a7f76" font-size="10.5">It was just where we put it.</text>
  <rect x="725" y="128" width="435" height="66" rx="10" fill="#0e0f12" stroke="#1e3a2e"/>
  <text x="741" y="150" fill="#cfe6da" font-size="11"><tspan fill="#bcdb2c" font-weight="650">Two shapes, one implementation.</tspan> A gateway with</text>
  <text x="741" y="166" fill="#cfe6da" font-size="11">plain MCPs behind it, or no gateway at all and the</text>
  <text x="741" y="182" fill="#cfe6da" font-size="11">MCP server handling the grant itself.</text>

  <!-- ROW 2 -->
  <text x="58" y="230" fill="#ffffff" font-size="11.5" font-weight="650">Beat 1 — the challenge</text>
  <text x="58" y="245" fill="#6c727a" font-size="9.5">what a core spec should require</text>
  <rect x="290" y="206" width="415" height="66" rx="10" fill="#0e0f12" stroke="#2e2721"/>
  <text x="306" y="228" fill="#c9b8a8" font-size="11">401 + <tspan font-family="ui-monospace, Menlo, monospace" font-size="10">WWW-Authenticate: UMA</tspan></text>
  <text x="306" y="245" fill="#8a7f76" font-size="10.5">The obvious thing to write into a spec. But a server</text>
  <text x="306" y="260" fill="#8a7f76" font-size="10.5">with no gateway has no status line to put it on.</text>
  <rect x="725" y="206" width="435" height="66" rx="10" fill="#0e0f12" stroke="#1e3a2e"/>
  <text x="741" y="224" fill="#cfe6da" font-size="11">Required <tspan fill="#bcdb2c" font-weight="650">parameters</tspan>; bindings carry them. Header</text>
  <text x="741" y="239" fill="#cfe6da" font-size="11">where there's a status line, −32001 where there isn't.</text>
  <text x="741" y="254" fill="#8fae9e" font-size="10.5">Now a <tspan fill="#bcdb2c">superset</tspan> of the RAR-metadata step-up</text>
  <text x="741" y="268" fill="#8fae9e" font-size="10.5">challenge, plus who decides and a ticket.</text>

  <!-- ROW 3 -->
  <text x="58" y="308" fill="#ffffff" font-size="11.5" font-weight="650">Spending a single-use grant</text>
  <text x="58" y="323" fill="#e8836b" font-size="9.5" font-weight="600">security fix</text>
  <rect x="290" y="284" width="415" height="66" rx="10" fill="#0e0f12" stroke="#3a2622"/>
  <text x="306" y="306" fill="#e8836b" font-size="11" font-weight="600">Consumed before the signature was checked.</text>
  <text x="306" y="323" fill="#c9b8a8" font-size="10.5">Anyone who saw the token could replay it unsigned</text>
  <text x="306" y="338" fill="#c9b8a8" font-size="10.5">and destroy an approval Alice had just given.</text>
  <rect x="725" y="284" width="435" height="66" rx="10" fill="#0e0f12" stroke="#1e3a2e"/>
  <text x="741" y="306" fill="#cfe6da" font-size="11">introspect → permissions → PoP → operation binding</text>
  <text x="741" y="323" fill="#cfe6da" font-size="11">→ <tspan fill="#bcdb2c" font-weight="650">consume, atomic and last.</tspan></text>
  <text x="741" y="338" fill="#8fae9e" font-size="10.5">A forged replay is now a permanent act in the demo.</text>

  <!-- ROW 4 -->
  <text x="58" y="386" fill="#ffffff" font-size="11.5" font-weight="650">The pend</text>
  <text x="58" y="401" fill="#6c727a" font-size="9.5">waiting on someone who isn't there</text>
  <rect x="290" y="362" width="415" height="66" rx="10" fill="#0e0f12" stroke="#2e2721"/>
  <text x="306" y="384" fill="#c9b8a8" font-size="11">The shim blocked, polling, for up to two minutes.</text>
  <text x="306" y="401" fill="#8a7f76" font-size="10.5">Bob's agent looked hung while Alice decided.</text>
  <rect x="725" y="362" width="435" height="66" rx="10" fill="#0e0f12" stroke="#1e3a2e"/>
  <text x="741" y="384" fill="#cfe6da" font-size="11">Handed up as MCP <tspan font-family="ui-monospace, Menlo, monospace" font-size="10">input_required</tspan> with a</text>
  <text x="741" y="400" fill="#cfe6da" font-size="11">resumable <tspan font-family="ui-monospace, Menlo, monospace" font-size="10">request_state</tspan>.</text>
  <text x="741" y="416" fill="#8fae9e" font-size="10.5">A pend is a state to render, not a call to hold open.</text>

  <!-- ROW 5 -->
  <text x="58" y="464" fill="#ffffff" font-size="11.5" font-weight="650">Naming the third party</text>
  <text x="58" y="479" fill="#a8d5e3" font-size="9.5" font-weight="600">the finding we're taking to MCP</text>
  <rect x="290" y="440" width="415" height="66" rx="10" fill="#0e0f12" stroke="#2e2721"/>
  <text x="306" y="460" fill="#c9b8a8" font-size="11">The thesis was a claim about emphasis: agent</text>
  <text x="306" y="476" fill="#c9b8a8" font-size="11">protocols answer "is this my agent doing my task",</text>
  <text x="306" y="492" fill="#c9b8a8" font-size="11">none answer "may your agent touch my stuff".</text>
  <rect x="725" y="440" width="435" height="66" rx="10" fill="#0e0f12" stroke="#1a1c21"/>
  <text x="741" y="461" fill="#a8d5e3" font-size="10.5"><tspan font-family="ui-monospace, Menlo, monospace" font-size="10">input_requests</tspan> is a <tspan fill="#a8d5e3" font-weight="650">closed union</tspan> of three requests</text>
  <text x="741" y="476" fill="#a8d5e3" font-size="10.5">that all address the client's <tspan font-style="italic">own</tspan> user. The type system</text>
  <text x="741" y="491" fill="#a8d5e3" font-size="10.5">cannot express "blocked on a different principal."</text>

  <!-- ROW 6 -->
  <text x="58" y="542" fill="#ffffff" font-size="11.5" font-weight="650">Who is this agent?</text>
  <text x="58" y="557" fill="#6c727a" font-size="9.5">the RqP ≠ RO cold start</text>
  <rect x="290" y="518" width="415" height="66" rx="10" fill="#0e0f12" stroke="#2e2721"/>
  <text x="306" y="540" fill="#c9b8a8" font-size="11">A raw key thumbprint in Alice's approval dialog.</text>
  <text x="306" y="557" fill="#8a7f76" font-size="10.5">Nothing a party who had never met this agent</text>
  <text x="306" y="572" fill="#8a7f76" font-size="10.5">could resolve.</text>
  <rect x="725" y="518" width="435" height="66" rx="10" fill="#0e0f12" stroke="#1e3a2e"/>
  <text x="741" y="540" fill="#cfe6da" font-size="11">CIMD document + Web Bot Auth key directory.</text>
  <text x="741" y="557" fill="#8fae9e" font-size="10.5">Alice sees the operating firm. Strictly display and</text>
  <text x="741" y="572" fill="#8fae9e" font-size="10.5">discovery — the verifying key is still the RPT's cnf.</text>

  <!-- ROW 7 -->
  <text x="58" y="620" fill="#ffffff" font-size="11.5" font-weight="650">The MCP wire</text>
  <text x="58" y="635" fill="#6c727a" font-size="9.5">2026-07-28</text>
  <rect x="290" y="596" width="415" height="66" rx="10" fill="#0e0f12" stroke="#2e2721"/>
  <text x="306" y="618" fill="#c9b8a8" font-size="11">Protocol 2025-03-26, sessions, <tspan font-family="ui-monospace, Menlo, monospace" font-size="10">initialize</tspan>.</text>
  <text x="306" y="635" fill="#8a7f76" font-size="10.5">SDK pins floated — the lab was one rebuild away</text>
  <text x="306" y="650" fill="#8a7f76" font-size="10.5">from broken and nobody would have known why.</text>
  <rect x="725" y="596" width="435" height="66" rx="10" fill="#0e0f12" stroke="#1e3a2e"/>
  <text x="741" y="618" fill="#cfe6da" font-size="11">Stateless, <tspan font-family="ui-monospace, Menlo, monospace" font-size="10">server/discover</tspan>, identity in <tspan font-family="ui-monospace, Menlo, monospace" font-size="10">_meta</tspan>.</text>
  <text x="741" y="635" fill="#8fae9e" font-size="10.5">2026-07-28 is unreachable through <tspan font-family="ui-monospace, Menlo, monospace" font-size="9.5">initialize</tspan> by</text>
  <text x="741" y="650" fill="#8fae9e" font-size="10.5">construction — ask for it there and you get 2025-11-25.</text>

  <!-- ROW 8 -->
  <text x="58" y="698" fill="#ffffff" font-size="11.5" font-weight="650">Routing headers</text>
  <text x="58" y="713" fill="#e8836b" font-size="9.5" font-weight="600">new attack class</text>
  <rect x="290" y="674" width="415" height="66" rx="10" fill="#0e0f12" stroke="#2e2721"/>
  <text x="306" y="696" fill="#c9b8a8" font-size="11">Didn't exist. SEP-2243 mirrors the JSON-RPC</text>
  <text x="306" y="713" fill="#c9b8a8" font-size="11">method into headers so a proxy can enforce</text>
  <text x="306" y="728" fill="#8a7f76" font-size="10.5">without parsing a body.</text>
  <rect x="725" y="674" width="435" height="66" rx="10" fill="#0e0f12" stroke="#1e3a2e"/>
  <text x="741" y="696" fill="#cfe6da" font-size="11">Reconciled against the body, and <tspan fill="#bcdb2c" font-weight="650">required</tspan>.</text>
  <text x="741" y="713" fill="#8fae9e" font-size="10.5">Two parsers over one message is the request-smuggling</text>
  <text x="741" y="728" fill="#8fae9e" font-size="10.5">shape, arriving in a brand-new protocol.</text>

  <text x="600" y="800" text-anchor="middle" fill="#6c727a" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">UMA 2.0  ·  AAuth  ·  MyTerms (IEEE 7012)  ·  RFC 9728 PRM  ·  RFC 9421  ·  MCP 2026-07-28  ·  CIMD  ·  Web Bot Auth</text>
</svg>
