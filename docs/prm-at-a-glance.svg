<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cc2d4"/><stop offset="1" stop-color="#5e8fa3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.75" cy="0" r="0.8">
      <stop offset="0" stop-color="#8cc2d4" stop-opacity="0.10"/><stop offset="1" stop-color="#8cc2d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.7">
      <stop offset="0" stop-color="#5e8fa3" stop-opacity="0.08"/><stop offset="1" stop-color="#5e8fa3" stop-opacity="0"/>
    </radialGradient>
    <marker id="mAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8cc2d4"/>
    </marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bcdb2c"/>
    </marker>
    <marker id="mWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2b955"/>
    </marker>
    <marker id="mDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c727a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="780" fill="#0a0b0d"/>
  <rect width="1200" height="780" fill="url(#glow1)"/>
  <rect width="1200" height="780" fill="url(#glow2)"/>

  <!-- header -->
  <!-- U4A monogram. Geometry: site/src/style/marks.js · colour: site/src/style/theme.js -->
  <g transform="translate(40 26) scale(0.53125)">
    <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="15" fill="#0a0b0d" stroke="#8cc2d4" stroke-width="2.8"/>
    <g fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 17 L11 33 A5.75 5.75 0 0 0 22.5 33 L22.5 17" stroke="#ffffff"/>
      <path d="M34.5 17 L26.25 31 L37.75 31 M34.5 17 L34.5 39" stroke="#bcdb2c"/>
      <path d="M41.5 39 L47.25 17 L53 39 M43.5 31.5 L51 31.5" stroke="#ffffff"/>
    </g>
    <path d="M20 46.5 L44 46.5" fill="none" stroke="#8cc2d4" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <text x="88" y="42" fill="#ffffff" font-size="17" font-weight="650">Registration, before and after RFC 9728</text>
  <text x="88" y="60" fill="#a9aeb6" font-size="12">What changes when RReg's push becomes declarative pull — and what deliberately doesn't</text>
  <text x="1160" y="42" text-anchor="end" fill="#6c727a" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace">UMA FedAuthz · RFC 9728 PRM · RFC 9421</text>

  <!-- center divider -->
  <line x1="600" y1="96" x2="600" y2="614" stroke="#24262c" stroke-dasharray="3 5"/>

  <!-- ======================= LEFT: PUSH ======================= -->
  <text x="40" y="104" fill="#6c727a" font-size="10" letter-spacing="2" font-weight="600">PUSH — CLASSIC FEDAUTHZ</text>
  <text x="560" y="104" text-anchor="end" fill="#6c727a" font-size="10" font-family="ui-monospace, Menlo, monospace">tag: rreg-baseline</text>

  <!-- agent card L -->
  <rect x="40" y="118" width="520" height="64" rx="12" fill="#121317" stroke="#24262c"/>
  <text x="58" y="140" fill="#6c727a" font-size="10" letter-spacing="1.6" font-weight="600">REQUESTING SIDE</text>
  <text x="58" y="160" fill="#ffffff" font-size="13" font-weight="650">Bob's agent + shim</text>
  <text x="230" y="160" fill="#a9aeb6" font-size="10.5">learns everything from the challenge — no discovery</text>

  <!-- challenge arrows L -->
  <line x1="120" y1="182" x2="120" y2="238" stroke="#8cc2d4" stroke-width="1.6" marker-end="url(#mAccent)"/>
  <text x="136" y="202" fill="#8cc2d4" font-size="10.5" font-weight="600">① tools/call → 401 · ticket + as_uri</text>
  <text x="136" y="217" fill="#f2b955" font-size="10.5">as_uri taken on faith — an unauthenticated header</text>
  <text x="136" y="231" fill="#6c727a" font-size="9.5" font-family="ui-monospace, Menlo, monospace">WWW-Authenticate: UMA</text>

  <!-- RS card L -->
  <rect x="40" y="244" width="520" height="118" rx="12" fill="#121317" stroke="#24262c"/>
  <text x="58" y="266" fill="#6c727a" font-size="10" letter-spacing="1.6" font-weight="600">RESOURCE SIDE · PEP</text>
  <text x="58" y="286" fill="#ffffff" font-size="13" font-weight="650">agentgateway + uma-pep</text>
  <text x="290" y="286" fill="#6c727a" font-size="10" font-family="ui-monospace, Menlo, monospace">holds Alice's PAT</text>
  <rect x="56" y="298" width="488" height="50" rx="8" fill="#1a1c21" stroke="#24262c"/>
  <text x="70" y="316" fill="#a9aeb6" font-size="10.5">registers every tool surface at the AS, one call each, before anything works</text>
  <text x="70" y="333" fill="#a9aeb6" font-size="10.5">owner-bound resource ids travel inside the private RS → AS channel</text>

  <!-- push arrows L -->
  <line x1="150" y1="362" x2="150" y2="452" stroke="#8cc2d4" stroke-width="2.4" marker-end="url(#mAccent)"/>
  <text x="166" y="382" fill="#8cc2d4" font-size="11.5" font-weight="650">registration is PUSHED</text>
  <text x="166" y="397" fill="#5e8fa3" font-size="10.5">N × POST /rreg — imperative, PAT-authorized</text>
  <line x1="470" y1="452" x2="470" y2="362" stroke="#f2b955" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#mWarn)"/>
  <text x="454" y="416" text-anchor="end" fill="#f2b955" font-size="10">AS restart strands the registry: invalid_resource_id →</text>
  <text x="454" y="430" text-anchor="end" fill="#f2b955" font-size="10">the RS must notice and re-push</text>

  <!-- AS card L -->
  <rect x="40" y="458" width="520" height="96" rx="12" fill="#121317" stroke="#24262c"/>
  <text x="58" y="480" fill="#6c727a" font-size="10" letter-spacing="1.6" font-weight="600">ALICE'S SIDE · AUTHORIZATION SERVER</text>
  <text x="58" y="500" fill="#ffffff" font-size="13" font-weight="650">uma-as — resource registry</text>
  <rect x="56" y="512" width="488" height="32" rx="8" fill="#1a1c21" stroke="#24262c"/>
  <text x="70" y="532" fill="#a9aeb6" font-size="10.5">ids assigned by the AS at registration · registry is written state, owned remotely</text>

  <!-- ======================= RIGHT: PULL ======================= -->
  <text x="640" y="104" fill="#6c727a" font-size="10" letter-spacing="2" font-weight="600">PULL — DECLARATIVE VIA RFC 9728</text>
  <text x="1160" y="104" text-anchor="end" fill="#6c727a" font-size="10" font-family="ui-monospace, Menlo, monospace">branch: prm-discovery</text>

  <!-- agent card R -->
  <rect x="640" y="118" width="520" height="64" rx="12" fill="#121317" stroke="#24262c"/>
  <text x="658" y="140" fill="#6c727a" font-size="10" letter-spacing="1.6" font-weight="600">REQUESTING SIDE</text>
  <text x="658" y="160" fill="#ffffff" font-size="13" font-weight="650">Bob's agent + shim</text>
  <text x="830" y="160" fill="#bcdb2c" font-size="10.5">reads the public shape before its first call (Beat 0)</text>

  <!-- challenge arrows R -->
  <line x1="720" y1="182" x2="720" y2="238" stroke="#8cc2d4" stroke-width="1.6" marker-end="url(#mAccent)"/>
  <text x="736" y="198" fill="#8cc2d4" font-size="10.5" font-weight="600">① tools/call → 401 · ticket + as_uri + resource_metadata</text>
  <text x="736" y="213" fill="#bcdb2c" font-size="10.5">✓ as_uri corroborated against the published metadata</text>
  <text x="736" y="227" fill="#6c727a" font-size="9.5" font-family="ui-monospace, Menlo, monospace">a challenge naming an unpublished AS is refused</text>

  <!-- RS card R -->
  <rect x="640" y="244" width="520" height="118" rx="12" fill="#121317" stroke="#24262c"/>
  <text x="658" y="266" fill="#6c727a" font-size="10" letter-spacing="1.6" font-weight="600">RESOURCE SIDE · PEP</text>
  <text x="658" y="286" fill="#ffffff" font-size="13" font-weight="650">agentgateway + uma-pep</text>
  <text x="890" y="286" fill="#6c727a" font-size="10" font-family="ui-monospace, Menlo, monospace">publishes only — no /rreg calls</text>
  <rect x="656" y="298" width="238" height="50" rx="8" fill="#1a1c21" stroke="#bcdb2c" stroke-opacity="0.45"/>
  <text x="668" y="314" fill="#bcdb2c" font-size="10.5" font-weight="620">PUBLIC — structure, signed</text>
  <text x="668" y="328" fill="#a9aeb6" font-size="9.5">tools · scopes · AS location · jwks_uri</text>
  <text x="668" y="341" fill="#6c727a" font-size="8.5" font-family="ui-monospace, Menlo, monospace">/.well-known/oauth-protected-resource/mcp</text>
  <rect x="906" y="298" width="238" height="50" rx="8" fill="#1a1c21" stroke="#f2b955" stroke-opacity="0.5"/>
  <text x="918" y="314" fill="#f2b955" font-size="10.5" font-weight="620">🔒 PROTECTED — whose instances</text>
  <text x="918" y="328" fill="#a9aeb6" font-size="9.5">Alice's resource ids — "protected webfinger"</text>
  <text x="918" y="341" fill="#6c727a" font-size="8.5" font-family="ui-monospace, Menlo, monospace">/owner-resources — only her AS may ask</text>

  <!-- pull arrows R -->
  <line x1="775" y1="452" x2="775" y2="362" stroke="#bcdb2c" stroke-width="2.4" marker-end="url(#mGreen)"/>
  <text x="666" y="390" fill="#bcdb2c" font-size="11.5" font-weight="650">registration is PULLED</text>
  <text x="666" y="406" fill="#cde84f" font-size="10.5">one fetch · signed_metadata verified</text>
  <line x1="1025" y1="452" x2="1025" y2="362" stroke="#f2b955" stroke-width="2" marker-end="url(#mWarn)"/>
  <text x="1041" y="390" fill="#f2b955" font-size="10.5" font-weight="620">signed query —</text>
  <text x="1041" y="404" fill="#f2b955" font-size="10.5" font-weight="620">proves her AS's key</text>
  <text x="1041" y="418" fill="#6c727a" font-size="9.5" font-family="ui-monospace, Menlo, monospace">RFC 9421</text>
  <text x="900" y="440" text-anchor="middle" fill="#a9aeb6" font-size="10">unknown id at /perm → AS re-pulls · self-healing</text>

  <!-- AS card R -->
  <rect x="640" y="458" width="520" height="96" rx="12" fill="#121317" stroke="#24262c"/>
  <text x="658" y="480" fill="#6c727a" font-size="10" letter-spacing="1.6" font-weight="600">ALICE'S SIDE · AUTHORIZATION SERVER</text>
  <text x="658" y="500" fill="#ffffff" font-size="13" font-weight="650">uma-as — registry materialized by pull</text>
  <rect x="656" y="512" width="488" height="32" rx="8" fill="#1a1c21" stroke="#24262c"/>
  <text x="670" y="532" fill="#a9aeb6" font-size="10.5">ids adopted from what the RS publishes, namespaced under the resource identifier</text>

  <!-- ======================= UNCHANGED strip ======================= -->
  <rect x="40" y="618" width="1120" height="76" rx="12" fill="#0e0f12" stroke="#24262c"/>
  <text x="58" y="642" fill="#6c727a" font-size="10" letter-spacing="2" font-weight="600">WHAT DELIBERATELY DOESN'T CHANGE</text>
  <text x="58" y="664" fill="#a9aeb6" font-size="11">The PAT still authorizes /perm and introspection · the permission ticket is still the intent artifact · terms, agreements, PoP grants — beats ② ③ ④ — untouched</text>
  <text x="58" y="682" fill="#ffffff" font-size="11" font-weight="600">Metadata tells you the shape of the door. The ticket still tells you whose door, and the terms of entry.</text>

  <!-- footer -->
  <text x="600" y="726" text-anchor="middle" fill="#6c727a" font-size="10.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">both methods built and measured; the declarative profile is what ships    ·    RReg preserved on branch legacy/rreg-baseline</text>
</svg>
