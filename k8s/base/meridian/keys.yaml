# The resource server's signing key, generated once and shared.
#
# Same pattern and same reasoning as alice/keys.yaml, and deliberately a
# separate object in a separate namespace rather than a shared one: Meridian
# and Alice are different parties, and neither should be able to read the
# other's key material.
#
# Both uma-as and uma-pep call `load_or_create_key()` at startup: if the PEM
# is there they load it, otherwise they generate one. Under compose that is
# backed by a per-container volume and there is exactly one container, so it
# works. At replicas each pod generates a *different* key, and neither
# failure is a clean error:
#
#   uma-as   — three replicas publish three different JWKS behind one
#              Service, so a token signed by one verifies against another
#              roughly a third of the time.
#   uma-pep  — one replica signs the resource's signed_metadata, the AS
#              fetches /jwks and reaches a different replica, and the
#              registry pull fails with "signed_metadata did not verify"
#              about half the time.
#
# So the key is generated once into a Secret and mounted read-only. No
# application change: load_or_create_key finds the file and loads it.
#
# The job runs the service's own image and talks to the Kubernetes API with
# its mounted ServiceAccount token. That is deliberate: the obvious
# alternative — a kubectl image plus `openssl genpkey` — needs a container
# that has both, and the usual kubectl images ship neither openssl nor a
# package manager anyone should be invoking at job runtime. The service image
# already carries the exact library that will later load this key, so the key
# is generated by the same code that has to read it.
#
# Idempotent: it creates the Secret only if absent, so re-applying the stack
# never rotates a key underneath running pods.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keygen
  namespace: meridian
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keygen
  namespace: meridian
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # get to check, create to make. Deliberately no update or delete: this
    # job must never be able to replace a key that already exists.
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keygen
  namespace: meridian
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keygen
subjects:
  - kind: ServiceAccount
    name: keygen
    namespace: meridian
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keygen-script
  namespace: meridian
data:
  keygen.py: |
    """Create an Ed25519 signing key as a Secret, once."""
    import base64, json, os, ssl, sys, urllib.request

    NAME = sys.argv[1]          # secret name
    FILENAME = sys.argv[2]      # key within the secret, and the mounted filename
    NS = os.environ.get("POD_NAMESPACE", "meridian")

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    with open(f"{SA}/token") as f:
        token = f.read().strip()
    api = "https://kubernetes.default.svc"
    ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")

    def call(method, path, body=None):
        req = urllib.request.Request(
            api + path, method=method,
            data=json.dumps(body).encode() if body is not None else None,
            headers={"Authorization": f"Bearer {token}",
                     "Content-Type": "application/json"})
        return urllib.request.urlopen(req, context=ctx)

    try:
        call("GET", f"/api/v1/namespaces/{NS}/secrets/{NAME}")
        print(f"{NAME} already exists; leaving it alone")
        raise SystemExit(0)
    except urllib.error.HTTPError as exc:
        if exc.code != 404:
            raise

    from cryptography.hazmat.primitives import serialization
    from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

    pem = Ed25519PrivateKey.generate().private_bytes(
        serialization.Encoding.PEM,
        serialization.PrivateFormat.PKCS8,
        serialization.NoEncryption())

    call("POST", f"/api/v1/namespaces/{NS}/secrets", {
        "apiVersion": "v1", "kind": "Secret", "metadata": {"name": NAME},
        "data": {FILENAME: base64.b64encode(pem).decode()},
    })
    print(f"{NAME} created")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: uma-pep-keygen
  namespace: meridian
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app: keygen }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keygen
      containers:
        - name: keygen
          image: localhost:5001/u4a/uma-pep:dev
          imagePullPolicy: Always
          command: ["python3", "/script/keygen.py", "uma-pep-signing-key", "uma-pep-ed25519.pem"]
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: script
          configMap: { name: keygen-script }
