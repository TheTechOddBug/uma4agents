# Alice's side, configured.
#
# These are the same local-lab development defaults the compose stack ships
# and the README documents as "demo credentials, not secrets". They are here
# as a Secret rather than inline so that the manifests read the way a real
# deployment would, and so that swapping them is a one-line change.
apiVersion: v1
kind: Secret
metadata:
  name: uma-as-config
  namespace: alice
stringData:
  # The resource server exchanges this for a PAT (client_credentials, scope
  # uma_protection). Meridian holds the same value in its own namespace —
  # deliberately duplicated rather than shared, because the two sides are
  # different parties and a shared Secret would model them as one.
  rs-client-secret: gateway-dev-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: portal-config
  namespace: alice
stringData:
  session-secret: dev-session-secret
