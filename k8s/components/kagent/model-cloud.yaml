# The same Agent, pointed at a hosted model instead of the local one.
#
# Applied by `make kagent MODEL=anthropic` or `MODEL=openai`, which creates the
# secret from a key in your environment. The key is read from your shell and
# put in a Secret; it is never written to this repository, and the Agent above
# is unchanged — only which ModelConfig named `u4a-model` exists.
#
# Nothing about the U4A path differs between local and hosted. The adapter
# holds Bob's signing key and runs the grant either way; the model only decides
# which tool to call.
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: u4a-model
  namespace: sterling-vance
spec:
  provider: ${MODEL_PROVIDER}
  model: ${MODEL_NAME}
  apiKeySecret: u4a-model-key
  apiKeySecretKey: api-key
